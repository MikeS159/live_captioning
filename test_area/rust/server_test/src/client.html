<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Dorian Gray</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tangerine:wght@400;700&family=JetBrains+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  body { margin:0; overflow:hidden; background:#000; }
  #container { position: relative; width:100vw; height:100vh; }

  /* Frame container */
  .frame {
    position: absolute;
    display: flex;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
    overflow: hidden;
  }

  .frame img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .frame .text {
    text-align: center;
    pointer-events: none;
    color: white;
    word-break: break-word;
    width: 100vw;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 4vw;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  .frame-text-area {
    position: absolute;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    outline: 2px dashed rgba(255,255,255,0.12);
  }

  .line {
    position: absolute;
    opacity: 0;
    text-align: center;
    transition: opacity 0.5s ease;
    width: 100vw;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    font-size: 4vw;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  .frame {
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .fade {
    opacity: 1 !important;
    transition: opacity 0.5s ease;
  }

  /* Falling text effect styles */
  .ml13 {
    font-size: 4vw;
    letter-spacing: normal;
    font-weight: 400;
    color: white;
    text-align: center;
    width: 100vw;
    left: 50%;
    top: 50%;
    position: absolute;
    transform: translate(-50%, -50%);
    margin: 0;
    padding: 0;
    z-index: 10;
    pointer-events: none;
    overflow: visible;
  }
  .ml13 .letter,
  .ml-step .letter {
    display: inline-block;
    line-height: 1em;
  }

  .ml-step {
    font-size: 4vw;
    letter-spacing: normal;
    font-weight: 400;
    color: white;
    text-align: center;
    width: 100vw;
    left: 50%;
    top: 50%;
    position: absolute;
    transform: translate(-50%, -50%);
    margin: 0;
    padding: 0;
    z-index: 10;
    pointer-events: none;
    overflow: visible;
  }

  /* Clock effect */
  .ml-clock {
    position: absolute;
    width: 100vw;
    height: 100vh;
    left: 0;
    top: 0;
    z-index: 10;
    pointer-events: none;
    overflow: visible;
  }
  .ml-clock .clock-word {
    position: absolute;
    font-size: 4vw;
    font-weight: 400;
    color: white;
    white-space: nowrap;
  }

  /* Smoke effect */
  .ml-smoke {
    font-size: 4vw;
    letter-spacing: normal;
    font-weight: 400;
    color: white;
    text-align: center;
    width: 100vw;
    left: 50%;
    top: 50%;
    position: absolute;
    transform: translate(-50%, -50%);
    margin: 0;
    padding: 0;
    z-index: 10;
    pointer-events: none;
    overflow: visible;
  }
  .ml-smoke .word {
    display: inline-block;
    margin: 0 0.3em;
    opacity: 0;
  }

  /* Blood drip effect */
  .ml-blood {
    font-size: 4vw;
    letter-spacing: normal;
    font-weight: 400;
    color: #cc0000;
    text-align: center;
    width: 100vw;
    left: 50%;
    top: 50%;
    position: absolute;
    transform: translate(-50%, -50%);
    margin: 0;
    padding: 0;
    z-index: 10;
    pointer-events: none;
    overflow: visible;
  }
  .ml-blood .letter {
    display: inline-block;
    line-height: 1em;
    position: relative;
  }
  .ml-blood .drip {
    position: absolute;
    top: 100%;
    left: 50%;
    width: 3px;
    height: 0;
    background: linear-gradient(to bottom, #cc0000, #880000 60%, transparent);
    border-radius: 0 0 2px 2px;
    transform: translateX(-50%);
  }

  /* Handwriting effect */
  .ml-handwriting {
    font-weight: 400;
    color: white;
    text-align: center;
    width: 100vw;
    left: 50%;
    top: 50%;
    position: absolute;
    transform: translate(-50%, -50%);
    margin: 0;
    padding: 0;
    z-index: 10;
    pointer-events: none;
    overflow: visible;
    font-family: 'Tangerine', cursive;
    font-size: 6vw;
  }
  .ml-handwriting .letter {
    display: inline-block;
    opacity: 0;
  }
</style>
</head>
<body>
  <div id="container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/2.0.2/anime.min.js"></script>

<script>
// Helper to apply falling text effect
function showFallingText(text, style, reverse = false) {
  document.querySelectorAll('.ml13').forEach(e => e.remove());
  const container = document.getElementById('container');
  const h1 = document.createElement('h1');
  h1.className = 'ml13';
  h1.textContent = text;
  if (style) {
    if (style.color) h1.style.color = style.color;
    if (style.font_size) h1.style.fontSize = style.font_size;
    if (style.font_family) h1.style.fontFamily = style.font_family;
    if (style.font_weight) h1.style.fontWeight = style.font_weight;
    if (style.font_style) h1.style.fontStyle = style.font_style;
    if (style.position) {
      h1.style.left = style.position.x || '50%';
      h1.style.top = style.position.y || '50%';
      h1.style.transform = 'translateX(-50%)';
    }
  }
  if (reverse) {
    h1.style.left = '50%';
    h1.style.top = '85%';
    h1.style.transform = 'translate(-50%, 0)';
  }
  container.appendChild(h1);
  h1.innerHTML = h1.textContent.replace(/\S/g, "<span class='letter'>$&</span>");
  anime.timeline({loop: false}).add({
    targets: '.ml13 .letter',
    translateY: reverse ? [0, -400] : [0, 400],
    opacity: [1,0],
    easing: "easeInExpo",
    duration: 1200,
    delay: (el, i) => 100 + 30 * i
  });
  setTimeout(() => h1.remove(), 3000 + text.length * 30);
}

// Helper to apply step effect
function showStepText(text, style, reverse = false) {
  document.querySelectorAll('.ml-step').forEach(e => e.remove());
  const container = document.getElementById('container');
  const h1 = document.createElement('h1');
  h1.className = 'ml-step';
  h1.textContent = text;
  if (style) {
    if (style.color) h1.style.color = style.color;
    if (style.font_size) h1.style.fontSize = style.font_size;
    if (style.font_family) h1.style.fontFamily = style.font_family;
    if (style.font_weight) h1.style.fontWeight = style.font_weight;
    if (style.font_style) h1.style.fontStyle = style.font_style;
    if (style.position) {
      h1.style.left = style.position.x || '50%';
      h1.style.top = style.position.y || '50%';
      h1.style.transform = 'translateX(-50%)';
    }
  }
  if (reverse) {
    h1.style.left = '50%';
    h1.style.top = '85%';
    h1.style.transform = 'translate(-50%, 0)';
  }
  container.appendChild(h1);
  h1.innerHTML = h1.textContent.replace(/\S/g, "<span class='letter'>$&</span>");
  anime.timeline({ loop: false })
    .add({
      targets: '.ml-step .letter',
      translateY: (el, i) => reverse ? [0, -80 - (i * 20)] : [0, 80 + (i * 20)],
      easing: 'easeInOutSine',
      duration: 600,
      delay: (el, i) => i * 80
    });
  setTimeout(() => h1.remove(), 1500 + text.length * 80);
}

// Clock effect - words orbit in a circle
function showClockText(text, style, total_duration) {
  document.querySelectorAll('.ml-clock').forEach(e => e.remove());
  const container = document.getElementById('container');
  const wrapper = document.createElement('div');
  wrapper.className = 'ml-clock';

  const words = text.split(/\s+/);
  const centerX = window.innerWidth / 2;
  const centerY = window.innerHeight / 2;
  const radius = Math.min(centerX, centerY) * 0.35;

  const wordEls = words.map((word, i) => {
    const span = document.createElement('span');
    span.className = 'clock-word';
    span.textContent = word;
    if (style) {
      if (style.color) span.style.color = style.color;
      if (style.font_size) span.style.fontSize = style.font_size;
      if (style.font_family) span.style.fontFamily = style.font_family;
      if (style.font_weight) span.style.fontWeight = style.font_weight;
      if (style.font_style) span.style.fontStyle = style.font_style;
    }
    wrapper.appendChild(span);
    return span;
  });

  container.appendChild(wrapper);

  // Measure word widths for centering
  const wordWidths = wordEls.map(el => el.offsetWidth);
  const wordHeights = wordEls.map(el => el.offsetHeight);

  // Starting angles evenly spaced
  const angleStep = (2 * Math.PI) / words.length;

  // Animate each word in a circular orbit
  wordEls.forEach((el, i) => {
    const startAngle = i * angleStep - Math.PI / 2; // start from top
    const obj = { angle: startAngle };

    // Position initially
    el.style.left = (centerX + radius * Math.cos(startAngle) - wordWidths[i] / 2) + 'px';
    el.style.top = (centerY + radius * Math.sin(startAngle) - wordHeights[i] / 2) + 'px';
    el.style.opacity = '1';

    const totalSteps = 16;
    const stepAngle = (Math.PI * 4) / totalSteps;
    let currentStep = 0;
    const stepDuration = 10000 / totalSteps;
    const stepInterval = setInterval(() => {
      currentStep++;
      const angle = startAngle + currentStep * stepAngle;
      const x = centerX + radius * Math.cos(angle) - wordWidths[i] / 2;
      const y = centerY + radius * Math.sin(angle) - wordHeights[i] / 2;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      if (currentStep >= totalSteps) clearInterval(stepInterval);
    }, stepDuration);

    anime({
      targets: obj,
      angle: startAngle + Math.PI * 4,
      duration: total_duration,
      easing: 'linear',
      update: function() {},
      complete: function() {
        // Fade out
        anime({
          targets: el,
          opacity: 0,
          duration: 500,
          easing: 'easeOutQuad'
        });
      }
    });
  });

  setTimeout(() => wrapper.remove(), total_duration + 2000);
}

// Smoke effect - words grow and dissolve into smoke
function showSmokeText(text, style, duration = 1600) { // duration per word in ms
  document.querySelectorAll('.ml-smoke').forEach(e => e.remove());
  const container = document.getElementById('container');
  const h1 = document.createElement('h1');
  h1.className = 'ml-smoke';

  const words = text.split(/\s+/);
  words.forEach(word => {
    const span = document.createElement('span');
    span.className = 'word';
    span.textContent = word;
    h1.appendChild(span);
  });

  if (style) {
    if (style.color) h1.style.color = style.color;
    if (style.font_size) h1.style.fontSize = style.font_size;
    if (style.font_family) h1.style.fontFamily = style.font_family;
    if (style.font_weight) h1.style.fontWeight = style.font_weight;
    if (style.font_style) h1.style.fontStyle = style.font_style;
    if (style.position) {
      h1.style.left = style.position.x || '50%';
      h1.style.top = style.position.y || '50%';
      h1.style.transform = 'translateX(-50%)';
    }
  }

  container.appendChild(h1);

  const wordEls = h1.querySelectorAll('.word');
  wordEls.forEach((el, i) => {
    anime.timeline({ loop: false })
      .add({
        targets: el,
        opacity: [0, 1],
        scale: [0.5, 1.2],
        duration: duration / 2,
        delay: i * duration,
        easing: 'easeOutQuad'
      })
      .add({
        targets: el,
        opacity: 0,
        scale: 2.5,
        translateY: -60,
        filter: ['blur(0px)', 'blur(20px)'],
        duration: duration / 2,
        easing: 'easeInQuad'
      });
  });

  setTimeout(() => h1.remove(), words.length * duration + 2000);
}

// Blood drip effect - text appears then drips blood
function showBloodText(text, style) {
  document.querySelectorAll('.ml-blood').forEach(e => e.remove());
  const container = document.getElementById('container');
  const h1 = document.createElement('h1');
  h1.className = 'ml-blood';
  h1.textContent = text;

  if (style) {
    if (style.color) h1.style.color = style.color;
    if (style.font_size) h1.style.fontSize = style.font_size;
    if (style.font_family) h1.style.fontFamily = style.font_family;
    if (style.font_weight) h1.style.fontWeight = style.font_weight;
    if (style.font_style) h1.style.fontStyle = style.font_style;
    if (style.position) {
      h1.style.left = style.position.x || '50%';
      h1.style.top = style.position.y || '50%';
      h1.style.transform = 'translateX(-50%)';
    }
  }

  container.appendChild(h1);

  // Wrap each letter, adding a drip element to select letters
  h1.innerHTML = h1.textContent.replace(/\S/g, "<span class='letter'>$&</span>");
  const letters = h1.querySelectorAll('.letter');

  // Fade letters in with slight stagger
  anime({
    targets: letters,
    opacity: [0, 1],
    translateY: [-20, 0],
    duration: 1,
    delay: (el, i) => i * 5,
    easing: 'easeOutQuad',
    complete: function() {
      // Add drips to ~70% of letters randomly
      letters.forEach((letter, i) => {
        if (Math.random() < 0.7 || i === letters.length - 1) {
          const drip = document.createElement('div');
          drip.className = 'drip';
          // Match text color for drip
          const color = h1.style.color || '#cc0000';
          drip.style.background = `linear-gradient(to bottom, ${color}, ${color}88 60%, transparent)`;
          letter.appendChild(drip);

          // Animate the drip growing downward
          const dripHeight = 20 + Math.random() * 80;
          const dripDelay = 200 + Math.random() * 1500;
          anime({
            targets: drip,
            height: [0, dripHeight],
            duration: 1500 + Math.random() * 2000,
            delay: dripDelay,
            easing: 'easeInQuad'
          });
        }
      });
    }
  });

  setTimeout(() => {
    anime({
      targets: h1,
      opacity: 0,
      duration: 1000,
      easing: 'easeInQuad',
      complete: () => h1.remove()
    });
  }, 6000);
}

// Handwriting effect - letters appear as if being written
function showHandwritingText(text, style) {
  document.querySelectorAll('.ml-handwriting').forEach(e => e.remove());
  const container = document.getElementById('container');
  const h1 = document.createElement('h1');
  h1.className = 'ml-handwriting';
  h1.textContent = text;

  if (style) {
    if (style.color) h1.style.color = style.color;
    if (style.font_size) h1.style.fontSize = style.font_size;
    if (style.font_family) h1.style.fontFamily = style.font_family || "'Tangerine', cursive";
    if (style.font_weight) h1.style.fontWeight = style.font_weight;
    if (style.font_style) h1.style.fontStyle = style.font_style;
    if (style.position) {
      h1.style.left = style.position.x || '50%';
      h1.style.top = style.position.y || '50%';
      h1.style.transform = 'translateX(-50%)';
    }
  }

  container.appendChild(h1);

  // Wrap every character (including spaces) in spans
  h1.innerHTML = h1.textContent.split('').map(ch => {
    if (ch === ' ') return "<span class='letter' style='width:0.3em;'>&nbsp;</span>";
    return "<span class='letter'>" + ch + "</span>";
  }).join('');

  const letters = h1.querySelectorAll('.letter');

  // Each letter fades in with a slight downward stroke feel
  anime({
    targets: letters,
    opacity: [0, 1],
    translateY: [10, 0],
    translateX: [-5, 0],
    rotateZ: [-8, 0],
    duration: 300,
    delay: (el, i) => i * 50,
    easing: 'easeOutQuad'
  });

  // Add a blinking cursor effect
  const cursor = document.createElement('span');
  cursor.textContent = '|';
  cursor.style.opacity = '1';
  cursor.style.fontWeight = '100';
  cursor.style.animation = 'none';
  cursor.style.marginLeft = '-2px';
  h1.appendChild(cursor);

  // Blink cursor
  let cursorVisible = true;
  const blinkInterval = setInterval(() => {
    cursorVisible = !cursorVisible;
    cursor.style.opacity = cursorVisible ? '1' : '0';
  }, 500);

  // After all letters written, keep cursor blinking briefly then remove
  const totalTime = text.length * 120 + 400;
  setTimeout(() => {
    clearInterval(blinkInterval);
    cursor.style.opacity = '0';
  }, totalTime + 2000);

  setTimeout(() => {
    anime({
      targets: h1,
      opacity: 0,
      duration: 1000,
      easing: 'easeInQuad',
      complete: () => h1.remove()
    });
  }, totalTime + 3000);
}

function normalizePadding(p) {
  if (!p) return null;
  if (typeof p === 'string') return p;
  const t = p.top ?? p.t ?? '0px';
  const r = p.right ?? p.r ?? '0px';
  const b = p.bottom ?? p.b ?? '0px';
  const l = p.left ?? p.l ?? '0px';
  function ensureUnit(v){
    if (v === undefined || v === null) return '0px';
    if (typeof v === 'number') return v + 'px';
    if (typeof v === 'string' && v.trim().match(/^[\d.]+$/)) return v + 'px';
    return v;
  }
  return `${ensureUnit(t)} ${ensureUnit(r)} ${ensureUnit(b)} ${ensureUnit(l)}`;
}

let reconnectDelay = 100;
function connectWS() {
  const container = document.getElementById('container');
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => {
    reconnectDelay = 100;
    console.log('WebSocket connected');
  };
  ws.onmessage = ev => {
    const msg = JSON.parse(ev.data);
    console.log('incoming msg', msg);

    // --- Animate effect handling ---
    if (msg && typeof msg.animate === 'string') {
      document.querySelectorAll('.ml13, .ml-step, .ml-clock, .ml-smoke, .ml-blood, .ml-handwriting, .line').forEach(e => e.remove());
      if (msg.animate === 'fall') {
        showFallingText(msg.text, msg.style || {});
        return;
      }
      if (msg.animate === 'fall-up') {
        showFallingText(msg.text, msg.style || {}, true);
        return;
      }
      if (msg.animate === 'step') {
        showStepText(msg.text, msg.style || {});
        return;
      }
      if (msg.animate === 'step-up') {
        showStepText(msg.text, msg.style || {}, true);
        return;
      }
      if (msg.animate === 'clock') {
        showClockText(msg.text, msg.style || {}, 4000);
        return;
      }
      if (msg.animate === 'clock-10s') {
        showClockText(msg.text, msg.style || {}, 10000);
        return;
      }
      //clock n seconds option
      if (msg.animate.startsWith('clock-')) {
        const parts = msg.animate.split('-');
        const duration = parseInt(parts[1]) * 1000;
        showClockText(msg.text, msg.style || {}, duration);
        return;
      }
      if (msg.animate === 'smoke') {
        showSmokeText(msg.text, msg.style || {}, 1000);
        return;
      }
      if (msg.animate === 'smoke-long') {
        showSmokeText(msg.text, msg.style || {}, 3000);
        return;
      }
      if (msg.animate === 'blood') {
        showBloodText(msg.text, msg.style || {});
        return;
      }
      if (msg.animate === 'handwriting') {
        showHandwritingText(msg.text, msg.style || {});
        return;
      }
    }

    // Video clearing logic
    if (msg.media && msg.media.kind === 'video' && msg.media.url === 'none') {
      Array.from(container.children).forEach(child => {
        if (child.classList.contains('frame') && child.querySelector('video')) {
          child.remove();
        }
      });
      return;
    }

    // For non-video, fade out old content
    if (!(msg.media && msg.media.kind === 'video')) {
      // Immediately remove any animated effect elements
      document.querySelectorAll('.ml13, .ml-step, .ml-clock, .ml-smoke, .ml-blood, .ml-handwriting').forEach(e => e.remove());
      const oldChildren = Array.from(container.children);
      if (oldChildren.length > 0) {
        oldChildren.forEach(child => {
          child.classList.remove('fade');
          setTimeout(() => child.remove(), 500);
        });
      }
    }

    // Image
    if (msg.media && msg.media.kind === 'image') {
      const frame = document.createElement('div');
      frame.className = 'frame';
      frame.style.left = (msg.style?.position?.x) || '50%';
      frame.style.top  = (msg.style?.position?.y) || '0';
      frame.style.transform = 'translate(-50%, 0)';
      if (msg.media.img_size) {
        frame.style.width  = msg.media.img_size.width;
        frame.style.height = msg.media.img_size.height;
      }
      const img = document.createElement('img');
      img.src = msg.media.url;
      frame.appendChild(img);
      container.appendChild(frame);
      setTimeout(() => frame.classList.add('fade'), 10);

      img.onload = () => {
        const textArea = document.createElement('div');
        textArea.className = 'frame-text-area';
        const pad = normalizePadding(msg.media?.padding);
        if (pad) textArea.style.padding = pad;
        const textDiv = document.createElement('div');
        textDiv.className = 'text';
        textDiv.innerHTML = msg.text;
        if (msg.style) {
          textDiv.style.color = msg.style.color;
          textDiv.style.fontSize = msg.style.font_size;
          textDiv.style.fontFamily = msg.style.font_family;
          textDiv.style.fontWeight = msg.style.font_weight || '400';
          textDiv.style.fontStyle = msg.style.font_style || 'normal';
        }
        textDiv.style.whiteSpace = 'normal';
        textArea.appendChild(textDiv);
        frame.appendChild(textArea);
      };
    }
    // Video
    else if (msg.media && msg.media.kind === 'video') {
      Array.from(container.children).forEach(child => {
        if (child.classList.contains('frame') && child.querySelector('img')) {
          child.remove();
        }
      });
      let existing = Array.from(container.children).find(child => {
        return child.classList.contains('frame') && child.querySelector('video') && child.querySelector('video').src === msg.media.url;
      });
      if (existing) return;

      const textDiv = document.createElement('div');
      textDiv.className = 'line';
      textDiv.innerHTML = msg.text;
      if (msg.style) {
        textDiv.style.color = msg.style.color;
        textDiv.style.fontSize = msg.style.font_size;
        textDiv.style.fontFamily = msg.style.font_family;
        textDiv.style.fontWeight = msg.style.font_weight || '400';
        textDiv.style.fontStyle = msg.style.font_style || 'normal';
      }
      textDiv.style.whiteSpace = 'normal';
      textDiv.style.position = 'absolute';
      textDiv.style.left = '50%';
      textDiv.style.top = '5%';
      textDiv.style.transform = 'translateX(-50%)';
      textDiv.style.width = '100%';
      textDiv.style.zIndex = '2';
      container.appendChild(textDiv);

      const frame = document.createElement('div');
      frame.className = 'frame';
      frame.style.left = (msg.style?.position?.x) || '50%';
      frame.style.top  = (msg.style?.position?.y) || '75%';
      frame.style.transform = 'translate(-50%, 0)';
      if (msg.media.img_size) {
        frame.style.width  = msg.media.img_size.width;
        frame.style.height = msg.media.img_size.height;
      }
      const video = document.createElement('video');
      video.src = msg.media.url;
      video.autoplay = true;
      video.controls = false;
      video.loop = false;
      video.style.width = '100%';
      video.style.height = '100%';
      video.style.position = 'relative';
      video.style.zIndex = '1';
      frame.appendChild(video);
      container.appendChild(frame);
      setTimeout(() => {
        frame.classList.add('fade');
        textDiv.classList.add('fade');
      }, 10);
      video.addEventListener('ended', () => {
        frame.classList.remove('fade');
        setTimeout(() => frame.remove(), 500);
      });
    }
    else {
      // Text-only
      const div = document.createElement('div');
      div.className = 'line';
      div.innerHTML = msg.text;
      if (msg.style) {
        div.style.color = msg.style.color;
        div.style.fontSize = msg.style.font_size;
        div.style.fontFamily = msg.style.font_family;
        div.style.fontWeight = msg.style.font_weight || '400';
        div.style.fontStyle = msg.style.font_style || 'normal';
        div.style.left = msg.style.position?.x || '50%';
        div.style.top  = msg.style.position?.y || '0';
        div.style.transform = 'translateX(-50%)';
      }
      container.appendChild(div);
      setTimeout(() => div.classList.add('fade'), 10);
      const wordCount = (msg.text || '').split(/\s+/).filter(Boolean).length;
      const fadeDelay = Math.max(5000, wordCount * 500);
      setTimeout(() => {
        div.classList.remove('fade');
        setTimeout(() => div.remove(), 500);
      }, fadeDelay);
    }
  };
  ws.onclose = () => {
    console.log('WebSocket closed, retrying in', reconnectDelay, 'ms');
    setTimeout(connectWS, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 5000);
  };
  ws.onerror = () => ws.close();
}
connectWS();
</script>
</body>
</html>
