<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Dorian Gray</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tangerine:wght@400;700&family=JetBrains+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  body { margin:0; overflow:hidden; background:#000; }
  #container { position: relative; width:100vw; height:100vh; }

  /* Frame container */
  .frame {
    position: absolute;
    display: flex;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
    overflow: hidden; /* keep image inside */
  }

  .frame img {
    display: block;
    width: 100%;
    height: 100%;
    /* use cover to ensure image fills the frame fully; switch to 'contain' if you prefer letterboxed image */
    object-fit: cover;
  }

/* Make .frame .text fill the viewport */
.frame .text {
  text-align: center;
  pointer-events: none;
  color: white;
  word-break: break-word;
  width: 100vw;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 4vw;
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
  /* padded overlay area for text */
  .frame-text-area {
    position: absolute;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    /* DEBUG: visible overlay border so you can see padding area — remove or change color when happy */
    outline: 2px dashed rgba(255,255,255,0.12);
  }

  .line {
    position: absolute;
    opacity: 0;
    text-align: center;
    transition: opacity 0.5s ease;
    width: 100vw;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    font-size: 4vw;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  .frame {
    /* ...existing frame styles... */
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .fade {
    opacity: 1 !important;
    transition: opacity 0.5s ease;
  }

  /* Falling text effect styles */
  .ml13 {
    font-size: 4vw;
    letter-spacing: normal;
    font-weight: 400;
    color: white;
    text-align: center;
    width: 100vw;
    left: 50%;
    top: 50%;
    position: absolute;
    transform: translate(-50%, -50%);
    margin: 0;
    padding: 0;
    z-index: 10;
    pointer-events: none;
    overflow: visible;
  }
  .ml13 .letter,
  .ml-step .letter {
    display: inline-block;
    line-height: 1em;
  }

  /* Center and style step effect like falling */
  .ml-step {
    font-size: 4vw;
    letter-spacing: normal;
    font-weight: 400;
    color: white;
    text-align: center;
    width: 100vw;
    left: 50%;
    top: 50%;
    position: absolute;
    transform: translate(-50%, -50%);
    margin: 0;
    padding: 0;
    z-index: 10;
    pointer-events: none;
    overflow: visible;
  }

  /* Clock effect */
  .ml-clock {
    font-size: 4vw;
    letter-spacing: normal;
    font-weight: 400;
    color: white;
    text-align: center;
    width: 100vw;
    left: 50%;
    top: 50%;
    position: absolute;
    transform: translate(-50%, -50%);
    margin: 0;
    padding: 0;
    z-index: 10;
    pointer-events: none;
    overflow: visible;
  }
  .ml-clock .word {
    display: inline-block;
    transform-origin: center center;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }

  /* Smoke effect */
  .ml-smoke {
    font-size: 4vw;
    letter-spacing: normal;
    font-weight: 400;
    color: white;
    text-align: center;
    width: 100vw;
    left: 50%;
    top: 50%;
    position: absolute;
    transform: translate(-50%, -50%);
    margin: 0;
    padding: 0;
    z-index: 10;
    pointer-events: none;
    overflow: visible;
  }
  .ml-smoke .word {
    display: inline-block;
    opacity: 0;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(1);
    filter: blur(0px);
  }
</style>
</head>
<body>
  <div id="container"></div>

<!-- Anime.js for text effects -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/2.0.2/anime.min.js"></script>

<script>
// Helper to apply falling text effect
function showFallingText(text, style, reverse = false) {
  // Remove any existing ml13
  document.querySelectorAll('.ml13').forEach(e => e.remove());
  const container = document.getElementById('container');
  const h1 = document.createElement('h1');
  h1.className = 'ml13';
  h1.textContent = text;
  // Apply style overrides if present
  if (style) {
    if (style.color) h1.style.color = style.color;
    if (style.font_size) h1.style.fontSize = style.font_size;
    if (style.font_family) h1.style.fontFamily = style.font_family;
    if (style.font_weight) h1.style.fontWeight = style.font_weight;
    if (style.font_style) h1.style.fontStyle = style.font_style;
    if (style.position) {
      h1.style.left = style.position.x || '50%';
      h1.style.top = style.position.y || '50%';
      h1.style.transform = 'translateX(-50%)';
    }
  }
  // For reverse, override position to bottom of screen
  if (reverse) {
    h1.style.left = '50%';
    h1.style.top = '85%';
    h1.style.transform = 'translate(-50%, 0)';
  }
  container.appendChild(h1);
  // Wrap every letter in a span
  h1.innerHTML = h1.textContent.replace(/\S/g, "<span class='letter'>$&</span>");
  anime.timeline({loop: false}).add({
      targets: '.ml13 .letter',
      translateY: reverse ? [0, -400] : [0, 400], // FALL up or down
      opacity: [1,0],
      easing: "easeInExpo",
      duration: 2500,
      delay: (el, i) => 90 * i
    });
  // Remove after animation (total duration)
  setTimeout(() => h1.remove(), 3000 + text.length * 30);
}

// Helper to apply step effect - letters step one after another (like falling but upward)
function showStepText(text, style, reverse = false) {
  document.querySelectorAll('.ml-step').forEach(e => e.remove());
  const container = document.getElementById('container');
  const h1 = document.createElement('h1');
  h1.className = 'ml-step';
  h1.textContent = text;
  // Apply style overrides if present
  if (style) {
    if (style.color) h1.style.color = style.color;
    if (style.font_size) h1.style.fontSize = style.font_size;
    if (style.font_family) h1.style.fontFamily = style.font_family;
    if (style.font_weight) h1.style.fontWeight = style.font_weight;
    if (style.font_style) h1.style.fontStyle = style.font_style;
    if (style.position) {
      h1.style.left = style.position.x || '50%';
      h1.style.top = style.position.y || '50%';
      h1.style.transform = 'translateX(-50%)';
    }
  }
  // For reverse, override position to bottom of screen
  if (reverse) {
    h1.style.left = '50%';
    h1.style.top = '85%';
    h1.style.transform = 'translate(-50%, 0)';
  }
  container.appendChild(h1);
  // Wrap every letter in a span
  h1.innerHTML = h1.textContent.replace(/\S/g, "<span class='letter'>$&</span>");
  // step each letter up or down and back in sequence
  anime.timeline({ loop: false })
    .add({
      targets: '.ml-step .letter',
      translateY: (el, i) => reverse ? [0, -80 - (i * 20)] : [0, 80 + (i * 20)],
      easing: 'easeInOutSine',
      duration: 600,
      delay: (el, i) => i * 80
    });
  // Remove after animation completes
  setTimeout(() => h1.remove(), 1500 + text.length * 80);
}

// Helper for clock hands effect - words rotate around center like clock hands
function showClockText(text, style) {
  document.querySelectorAll('.ml-clock').forEach(e => e.remove());
  const container = document.getElementById('container');
  const wrapper = document.createElement('h1');
  wrapper.className = 'ml-clock';
  if (style) {
    if (style.color) wrapper.style.color = style.color;
    if (style.font_size) wrapper.style.fontSize = style.font_size;
    if (style.font_family) wrapper.style.fontFamily = style.font_family;
    if (style.font_weight) wrapper.style.fontWeight = style.font_weight;
    if (style.font_style) wrapper.style.fontStyle = style.font_style;
    if (style.position) {
      wrapper.style.left = style.position.x || '50%';
      wrapper.style.top = style.position.y || '50%';
      wrapper.style.transform = 'translate(-50%, -50%)';
    }
  }
  container.appendChild(wrapper);

  const words = text.split(/\s+/);
  words.forEach((w, i) => {
    const span = document.createElement('span');
    span.className = 'word';
    span.textContent = w;
    span.style.opacity = '0';
    wrapper.appendChild(span);
  });

  const wordEls = wrapper.querySelectorAll('.word');
  const totalDuration = 4000;
  const stagger = 200;

  // Animate words swinging like clock hands — alternating left/right
  wordEls.forEach((el, i) => {
    const direction = i % 2 === 0 ? 1 : -1;
    const startAngle = direction * 90; // start from 3 o'clock or 9 o'clock

    anime.timeline({ loop: false })
      .add({
        targets: el,
        opacity: [0, 1],
        rotate: [startAngle, 0],
        duration: 1,
        easing: 'easeOutBack',
        delay: i * stagger
      })
      .add({
        targets: el,
        rotate: {
          value: [0, -direction * 360],
          duration: totalDuration,
          easing: 'linear'
        },
        delay: 200
      })
      .add({
        targets: el,
        opacity: [1, 0],
        rotate: [0, direction * 90],
        duration: 1,
        easing: 'easeInBack'
      });
  });

  setTimeout(() => wrapper.remove(), totalDuration + 3000);
}

// Helper for smoke dissolve effect - words grow and dissolve into smoke one after another
function showSmokeText(text, style) {
  document.querySelectorAll('.ml-smoke').forEach(e => e.remove());
  const container = document.getElementById('container');
  const wrapper = document.createElement('h1');
  wrapper.className = 'ml-smoke';
  if (style) {
    if (style.color) wrapper.style.color = style.color;
    if (style.font_size) wrapper.style.fontSize = style.font_size;
    if (style.font_family) wrapper.style.fontFamily = style.font_family;
    if (style.font_weight) wrapper.style.fontWeight = style.font_weight;
    if (style.font_style) wrapper.style.fontStyle = style.font_style;
    if (style.position) {
      wrapper.style.left = style.position.x || '50%';
      wrapper.style.top = style.position.y || '50%';
      wrapper.style.transform = 'translate(-50%, -50%)';
    }
  }
  container.appendChild(wrapper);

  const words = text.split(/\s+/);
  words.forEach(w => {
    const span = document.createElement('span');
    span.className = 'word';
    span.textContent = w;
    wrapper.appendChild(span);
  });

  const wordEls = wrapper.querySelectorAll('.word');
  const perWord = 1800;

  wordEls.forEach((el, i) => {
    anime.timeline({ loop: false })
      .add({
        targets: el,
        opacity: [0, 1],
        scale: [0.3, 1],
        duration: 500,
        easing: 'easeOutQuad',
        delay: i * perWord
      })
      .add({
        targets: el,
        scale: [1, 3],
        opacity: [1, 0],
        filter: ['blur(0px)', 'blur(20px)'],
        translateY: [0, -60],
        duration: 1200,
        easing: 'easeInQuad',
        delay: 200
      });
  });

  setTimeout(() => wrapper.remove(), words.length * perWord + 2000);
}
</script>
</head>
<body>
  <div id="container"></div>

<script>
function normalizePadding(p) {
  // Accept either:
  // 1) string like "10px 20px"
  // 2) object {top,right,bottom,left} with px values
  // 3) object {top:10, left:10} (numbers)
  if (!p) return null;
  if (typeof p === 'string') return p;
  const t = p.top ?? p.t ?? '0px';
  const r = p.right ?? p.r ?? p.right ?? '0px';
  const b = p.bottom ?? p.b ?? '0px';
  const l = p.left ?? p.l ?? '0px';
  // ensure units if number provided
  function ensureUnit(v){
    if (v === undefined || v === null) return '0px';
    if (typeof v === 'number') return v + 'px';
    if (typeof v === 'string' && v.trim().match(/^[\d.]+$/)) return v + 'px';
    return v;
  }
  return `${ensureUnit(t)} ${ensureUnit(r)} ${ensureUnit(b)} ${ensureUnit(l)}`;
}

let reconnectDelay = 100;
function connectWS() {
  const container = document.getElementById('container');
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => {
    reconnectDelay = 100; // Reset delay on successful connection
    console.log('WebSocket connected');
  };
  ws.onmessage = ev => {
    const msg = JSON.parse(ev.data);
    console.log('incoming msg', msg);


    // --- Animate effect handling: always check first ---
if (msg && typeof msg.animate === 'string') {
  document.querySelectorAll('.ml13, .ml-step, .ml-clock, .ml-smoke, .line').forEach(e => e.remove());
  if (msg.animate === 'fall') {
    showFallingText(msg.text, msg.style || {});
    return;
  }
  if (msg.animate === 'fall-up') {
    showFallingText(msg.text, msg.style || {}, true);
    return;
  }
  if (msg.animate === 'step') {
    showStepText(msg.text, msg.style || {});
    return;
  }
  if (msg.animate === 'step-up') {
    showStepText(msg.text, msg.style || {}, true);
    return;
  }
  if (msg.animate === 'clock') {
    showClockText(msg.text, msg.style || {});
    return;
  }
  if (msg.animate === 'smoke') {
    showSmokeText(msg.text, msg.style || {});
    return;
  }
}

    // Video clearing logic: if incoming video message has url 'none', remove all videos
    if (msg.media && msg.media.kind === 'video' && msg.media.url === 'none') {
      Array.from(container.children).forEach(child => {
        if (child.classList.contains('frame') && child.querySelector('video')) {
          child.remove();
        }
      });
      return;
    }
    // For non-video, fade out old content, then clear after fade
    if (!(msg.media && msg.media.kind === 'video')) {
      const oldChildren = Array.from(container.children);
      if (oldChildren.length > 0) {
        oldChildren.forEach(child => {
          child.classList.remove('fade');
          setTimeout(() => child.remove(), 500);
        });
      }
    }

    // If image, wrap in frame container
    if (msg.media && msg.media.kind === 'image') {
      const frame = document.createElement('div');
      frame.className = 'frame';

      // position frame on screen
      frame.style.left = (msg.style?.position?.x) || '50%';
      frame.style.top  = (msg.style?.position?.y) || '0';
      frame.style.transform = 'translate(-50%, 0)';

      // set outer frame size (img_size applies to the outer frame)
      if (msg.media.img_size) {
        frame.style.width  = msg.media.img_size.width;
        frame.style.height = msg.media.img_size.height;
      }

      // create image and add to frame
      const img = document.createElement('img');
      img.src = msg.media.url;
      frame.appendChild(img);
      container.appendChild(frame);

      // Fade in
      setTimeout(() => frame.classList.add('fade'), 10);

      // Wait for image to load before placing text-area (so sizes are stable)
      img.onload = () => {
        // Build padded text-area overlay (padding is applied to this overlay only)
        const textArea = document.createElement('div');
        textArea.className = 'frame-text-area';

        // Normalize and apply padding from JSON (robust)
        const pad = normalizePadding(msg.media?.padding);
        console.log('resolved padding:', pad);
        if (pad) textArea.style.padding = pad;

        // Now create the actual text element inside the padded area
        const textDiv = document.createElement('div');
        textDiv.className = 'text';
        textDiv.innerHTML = msg.text;

        if (msg.style) {
          textDiv.style.color = msg.style.color;
          textDiv.style.fontSize = msg.style.font_size;
          textDiv.style.fontFamily = msg.style.font_family;
          textDiv.style.fontWeight = msg.style.font_weight || '400';
          textDiv.style.fontStyle = msg.style.font_style || 'normal';
        }
          // allow multi-line wrapping inside the padded region
          textDiv.style.whiteSpace = 'normal';

        textArea.appendChild(textDiv);
        frame.appendChild(textArea);
      };

      // auto-remove after duration
      // setTimeout(() => {
      //   frame.remove();
      // }, msg.media.duration_ms || 5000);
    }

    // If video, wrap in frame container
    else if (msg.media && msg.media.kind === 'video') {
      // Remove all images when video starts
      Array.from(container.children).forEach(child => {
        if (child.classList.contains('frame') && child.querySelector('img')) {
          child.remove();
        }
      });
      // Check if a video with the same URL is already present
      let existing = Array.from(container.children).find(child => {
        return child.classList.contains('frame') && child.querySelector('video') && child.querySelector('video').src === msg.media.url;
      });
      if (existing) {
        // Already showing this video, do nothing
        return;
      }
      // Create text element as a separate div
      const textDiv = document.createElement('div');
      textDiv.className = 'line';
      textDiv.innerHTML = msg.text;
      if (msg.style) {
        textDiv.style.color = msg.style.color;
        textDiv.style.fontSize = msg.style.font_size;
        textDiv.style.fontFamily = msg.style.font_family;
        textDiv.style.fontWeight = msg.style.font_weight || '400';
        textDiv.style.fontStyle = msg.style.font_style || 'normal';
      }
      textDiv.style.whiteSpace = 'normal';
      textDiv.style.position = 'absolute';
      textDiv.style.left = '50%';
      textDiv.style.top = '5%';
      textDiv.style.transform = 'translateX(-50%)';
      textDiv.style.width = '100%';
      textDiv.style.zIndex = '2';
      container.appendChild(textDiv);

      // Create video element as a separate frame
      const frame = document.createElement('div');
      frame.className = 'frame';
      frame.style.left = (msg.style?.position?.x) || '50%';
      frame.style.top  = (msg.style?.position?.y) || '75%';
      frame.style.transform = 'translate(-50%, 0)';
      if (msg.media.img_size) {
        frame.style.width  = msg.media.img_size.width;
        frame.style.height = msg.media.img_size.height;
      }
      const video = document.createElement('video');
      video.src = msg.media.url;
      video.autoplay = true;
      video.controls = false;
      video.loop = false;
      video.style.width = '100%';
      video.style.height = '100%';
      video.style.position = 'relative';
      video.style.zIndex = '1';
      frame.appendChild(video);
      container.appendChild(frame);
      setTimeout(() => {
        frame.classList.add('fade');
        textDiv.classList.add('fade');
      }, 10);
      // Remove video when it finishes, but keep text
      video.addEventListener('ended', () => {
        frame.classList.remove('fade');
        setTimeout(() => frame.remove(), 500);
      });
    }
    else {
      // Text-only message
      const div = document.createElement('div');
      div.className = 'line';
      div.innerHTML = msg.text;

      if (msg.style) {
        div.style.color = msg.style.color;
        div.style.fontSize = msg.style.font_size;
        div.style.fontFamily = msg.style.font_family;
        div.style.fontWeight = msg.style.font_weight || '400';
        div.style.fontStyle = msg.style.font_style || 'normal';
        div.style.left = msg.style.position?.x || '50%';
        div.style.top  = msg.style.position?.y || '0';
        div.style.transform = 'translateX(-50%)';
        // Note: Don't set position here - frame handles positioning
      }

      container.appendChild(div);
      // Fade in
      setTimeout(() => div.classList.add('fade'), 10);

      // Fade out after 500ms * number of words
      const wordCount = (msg.text || '').split(/\s+/).filter(Boolean).length;
      const fadeDelay = Math.max(5000, wordCount * 500); // at least 5s
      setTimeout(() => {
        div.classList.remove('fade');
        setTimeout(() => div.remove(), 500); // match fade-out duration
      }, fadeDelay);
    }
  }
  ws.onclose = () => {
    console.log('WebSocket closed, retrying in', reconnectDelay, 'ms');
    setTimeout(connectWS, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 5000); // Exponential backoff up to 5s
  };
  ws.onerror = () => ws.close();
}
connectWS();
</script>
</body>
</html>
