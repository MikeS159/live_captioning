<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unique Speaker Colours</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #222;
      color: #fff;
      padding: 2em;
    }
    .color-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5em;
      margin-top: 2em;
    }
    .color-block {
      width: 120px;
      height: 120px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      font-size: 1em;
      font-weight: bold;
    }
    .color-label {
      margin-top: 0.7em;
      font-size: 0.95em;
      color: #fff;
      text-shadow: 0 1px 2px #000;
    }
  </style>
</head>
<body>
  <h1>Unique Speaker Colours</h1>
  <div class="color-grid">
    <div class="color-block" style="background: #FFFFFF; color: #222;">
      #FFFFFF
      <div class="color-label">White</div>
    </div>
    <div class="color-block" style="background: #C84A4A;">
      #C84A4A
      <div class="color-label">Red</div>
    </div>
    <div class="color-block" style="background: #D18A3A;">
      #D18A3A
      <div class="color-label">Orange</div>
    </div>
    <div class="color-block" style="background: #D4C64A; color: #222;">
      #D4C64A
      <div class="color-label">Yellow</div>
    </div>
    <div class="color-block" style="background: #5FA36A;">
      #5FA36A
      <div class="color-label">Green</div>
    </div>
    <div class="color-block" style="background: #4F6FAE;">
      #4F6FAE
      <div class="color-label">Blue</div>
    </div>
    <div class="color-block" style="background: #7A4FA3;">
      #7A4FA3
      <div class="color-label">Purple</div>
    </div>
    <div class="color-block" style="background: #7A1F2B;">
      #7A1F2B
      <div class="color-label">Dark Red</div>
    </div>
    <div class="color-block" style="background: #2F5D50;">
      #2F5D50
      <div class="color-label">Teal</div>
    </div>
    <div class="color-block" style="background: #DAA520; color: #222;">
      #DAA520
      <div class="color-label">Goldenrod</div>
    </div>
    <div class="color-block" style="background: #8A8A88; color: #222;">
      #8A8A88
      <div class="color-label">Grey</div>
    </div>
    <div class="color-block" style="background: #6A5ACD;">
      #6A5ACD
      <div class="color-label">Slate Blue</div>
    </div>
    <div class="color-block" style="background: #362988;">
      #362988
      <div class="color-label">Indigo</div>
    </div>
    <div class="color-block" style="background: #8B4513;">
      #8B4513
      <div class="color-label">Saddle Brown</div>
    </div>
    <div class="color-block" style="background: #6B4FA3;">
      #6B4FA3
      <div class="color-label">Violet</div>
    </div>
    <div class="color-block" style="background: #6E5C7A;">
      #6E5C7A
      <div class="color-label">Plum</div>
    </div>
  </div>
</body>
</html>
